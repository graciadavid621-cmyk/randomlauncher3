name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Gradle project
        run: |
          find_settings() {
            find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n1
          }
          SETTINGS=$(find_settings)
          if [ -z "$SETTINGS" ]; then
            # The project zip may have been uploaded to the repo without extracting
            for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
              echo "Extracting $z"
              unzip -oq "$z" -d _project || true
            done
            SETTINGS=$(find_settings)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found. Upload the project files (app/, settings.gradle, build.gradle...) to the repo, not just build.yml."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: mv "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "RandomLauncher-${{ steps.ver.outputs.tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Random Launcher ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: RandomLauncher-*.apk
